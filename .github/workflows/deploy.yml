name: Deploy

on:
  push:
    branches: [main]
    # The sync workflow commits a dated heartbeat to `main` once a day so
    # that GitHub never auto-disables the schedule. That is not a reason to
    # redeploy the Worker, and neither is prose.
    paths-ignore:
      - '.github/heartbeat'
      - '**/*.md'

  workflow_dispatch:

# A second push while the first is deploying should win, and the older
# deploy is of no interest once it has been superseded.
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm test

      - name: Deploy the Worker
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
